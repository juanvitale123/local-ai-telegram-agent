# Parte de mi config.yaml de Hermes (sin claves)

model:
  default: google/gemma-4-26b-a4b-qat
  provider: custom:local-(localhost:1234)
  base_url: http://localhost:1234/v1
  api_mode: chat_completions

custom_providers:
  - name: Local (localhost:1234)
    base_url: http://localhost:1234/v1
    api_key: lm-studio   # LM Studio no comprueba la clave
    model: google/gemma-4-26b-a4b-qat

display:
  personality: technical
  platforms:
    telegram:
      streaming: true

platform_toolsets:
  telegram:
    - hermes-telegram

terminal:
  backend: local
  persistent_shell: true

approvals:
  mode: manual       # pide confirmación antes de ejecutar comandos
  cron_mode: deny

compression:
  enabled: true
  threshold: 0.5

memory:
  memory_enabled: true

stt:
  enabled: true
  provider: local
  local:
    model: base
